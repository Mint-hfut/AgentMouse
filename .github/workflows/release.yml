name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check release version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version.' }
      - name: Build and test distributable
        run: ./scripts/build-release.ps1
      - name: Verify packaged installation
        run: ./scripts/test-release.ps1
      - name: Publish ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -Path release/*.zip,release/*.sha256 | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --title "AgentMouse $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
