name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run test:state
      - name: Fresh source installation
        if: matrix.node == 24
        run: ./scripts/test-source.ps1
      - name: Real browser-extension gestures (headless component acceptance)
        if: matrix.node == 24
        run: |
          $env:AGENTMOUSE_CHROME = ./scripts/get-test-chrome.ps1
          node scripts/test-background-chrome.mjs --headless-test --extension-bridge-test
          if ($LASTEXITCODE -ne 0) { throw 'Browser-extension component tests failed.' }
